name: Render d-band-center presentation options

on:
  push:
    branches: [main]
    paths:
      - '04_VASP_analysis/electronic_structure_publication_figures/source_data/V06_*'
      - '04_VASP_analysis/electronic_structure_publication_figures/plotting/plot_dband_center_options.py'
      - '04_VASP_analysis/electronic_structure_publication_figures/notes/V06_dband_center_interpretation_note.md'
      - '.github/workflows/render_dband_center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pillow

      - name: Render V06 d-band-center options
        run: python 04_VASP_analysis/electronic_structure_publication_figures/plotting/plot_dband_center_options.py

      - name: Verify expected outputs
        shell: bash
        run: |
          set -euo pipefail
          for stem in V06a_dband_center_absolute V06b_dband_center_shift_summary V06c_dband_center_schematic; do
            for ext in png tif pdf svg eps; do
              test -s "04_VASP_analysis/electronic_structure_publication_figures/figures/${stem}.${ext}"
            done
          done
          test -s "04_VASP_analysis/electronic_structure_publication_figures/source_data/V06_shift_summary.csv"
          echo "V06 render verification passed."

      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_VASP_analysis/electronic_structure_publication_figures/figures/V06* \
                  04_VASP_analysis/electronic_structure_publication_figures/source_data/V06_shift_summary.csv
          if git diff --cached --quiet; then
            echo "No rendered-output changes to commit."
          else
            git commit -m "Render V06 d-band-center publication options [skip ci]"
            git push
          fi
