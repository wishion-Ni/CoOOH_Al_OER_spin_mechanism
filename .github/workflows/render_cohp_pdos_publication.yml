name: Render COHP and PDOS publication figures

on:
  push:
    branches: [main]
    paths:
      - '04_VASP_analysis/electronic_structure_publication_data/**'
      - '04_VASP_analysis/electronic_structure_publication_figures/plotting/plot_cohp_pdos_publication.py'
      - '04_VASP_analysis/electronic_structure_publication_figures/plotting/compress_tiff_outputs.py'
      - '.github/workflows/render_cohp_pdos_publication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib pillow

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render figures
        run: python 04_VASP_analysis/electronic_structure_publication_figures/plotting/plot_cohp_pdos_publication.py

      - name: Compress TIFF outputs
        run: python 04_VASP_analysis/electronic_structure_publication_figures/plotting/compress_tiff_outputs.py

      - name: Verify generated PDFs render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdf_verify
          for f in 04_VASP_analysis/electronic_structure_publication_figures/figures/*.pdf; do
            base=$(basename "$f" .pdf)
            pdftoppm -png -singlefile -r 160 "$f" "/tmp/pdf_verify/$base" >/dev/null
            test -s "/tmp/pdf_verify/$base.png"
          done
          echo "PDF render verification passed."

      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_VASP_analysis/electronic_structure_publication_figures/figures \
                  04_VASP_analysis/electronic_structure_publication_figures/source_data \
                  04_VASP_analysis/electronic_structure_publication_figures/notes
          if git diff --cached --quiet; then
            echo "No rendered-output changes to commit."
          else
            git commit -m "Render COHP and PDOS publication figures"
            git push
          fi
