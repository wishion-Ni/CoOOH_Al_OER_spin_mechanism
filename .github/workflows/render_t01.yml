name: Render T01 manuscript figure

on:
  push:
    paths:
      - '02_DFT_CP2K/OER_free_energy/T01_combined_OER_staircase/publication_package/source_data/**'
      - '02_DFT_CP2K/OER_free_energy/T01_combined_OER_staircase/publication_package/plotting/plot_T01.py'
      - '.github/workflows/render_t01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas matplotlib pillow
      - run: python 02_DFT_CP2K/OER_free_energy/T01_combined_OER_staircase/publication_package/plotting/plot_T01.py
      - name: Commit rendered outputs when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02_DFT_CP2K/OER_free_energy/T01_combined_OER_staircase/publication_package/figures/
          if git diff --cached --quiet; then
            echo 'No rendered figure changes.'
          else
            git commit -m 'Render T01 manuscript figure outputs'
            git push
          fi
