name: Export key CP2K structures to CIF

on:
  push:
    branches: [main]
    paths:
      - '05_analysis_scripts/export_key_structures_to_cif.py'
      - 'archive_20260910/02_DFT_CP2K/validated_sources/cp2k_*_baseline.inp'
      - '.github/workflows/export_key_structures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade pip numpy

      - name: Export CIF structures
        run: python 05_analysis_scripts/export_key_structures_to_cif.py

      - name: Verify CIFs
        shell: bash
        run: |
          set -euo pipefail
          for f in pristine_OH pristine_O Al16_OH Al16_O; do
            test -s "structures/key_structures/${f}.cif"
            grep -q '_atom_site_fract_x' "structures/key_structures/${f}.cif"
          done
          test -s structures/key_structures/README.md
          echo 'CIF export verification passed.'

      - name: Commit generated structures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add structures/key_structures
          if git diff --cached --quiet; then
            echo 'No structure changes to commit.'
          else
            git commit -m 'Export key validated structures to CIF [skip ci]'
            git push
          fi
